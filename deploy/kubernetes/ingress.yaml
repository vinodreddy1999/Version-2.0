apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metam-fullstack
  namespace: metam
spec:
  rules:
    - host: metam.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metam-fullstack
                port:
                  number: 8080
