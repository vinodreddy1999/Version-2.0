apiVersion: v1
kind: Secret
metadata:
  name: metam-secrets
  namespace: metam
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-this-in-production
  DATABASE_URL: postgresql+psycopg2://metam:change-this-in-production@postgres:5432/metam
  # Generate each with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  JWT_SECRET: change-this-in-production
  LEGACY_JWT_SECRET: change-this-in-production
  PORTAL_JWT_SECRET: change-this-in-production
  MOBILE_JWT_SECRET: change-this-in-production
  SUPPLIER_PORTAL_JWT_SECRET: change-this-in-production
