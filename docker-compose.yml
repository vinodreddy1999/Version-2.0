name: metam-services-v2

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metam}
      POSTGRES_DB: ${POSTGRES_DB:-metam_v2}
    ports:
      - "${V2_POSTGRES_PORT:-55432}:5432"
    volumes:
      - metam_v2_postgres_data:/var/lib/postgresql/data
    networks:
      - metam-v2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metam} -d ${POSTGRES_DB:-metam_v2}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${V2_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - metam-v2-network

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@metam.localhost.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-ChangeMe123!}
    ports:
      - "${V2_PGADMIN_PORT:-15050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metam_v2_pgadmin_data:/var/lib/pgadmin
    networks:
      - metam-v2-network

  platform-api:
    image: vinodreddy1999/metam-services-v2-fullstack:${METAM_V2_IMAGE_TAG:-2.0.0-beta.5}
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-metam}:${POSTGRES_PASSWORD:-metam}@postgres:5432/${POSTGRES_DB:-metam_v2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_PUBLIC_DEMO: ${ENABLE_PUBLIC_DEMO:-false}
      PUBLIC_DEMO_TOKEN_MINUTES: ${PUBLIC_DEMO_TOKEN_MINUTES:-120}
    ports:
      - "${V2_API_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - metam-v2-network

  fullstack-app:
    image: vinodreddy1999/metam-services-v2-fullstack:${METAM_V2_IMAGE_TAG:-2.0.0-beta.5}
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-metam}:${POSTGRES_PASSWORD:-metam}@postgres:5432/${POSTGRES_DB:-metam_v2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_PUBLIC_DEMO: ${ENABLE_PUBLIC_DEMO:-false}
      PUBLIC_DEMO_TOKEN_MINUTES: ${PUBLIC_DEMO_TOKEN_MINUTES:-120}
    ports:
      - "${V2_APP_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - metam-v2-network

  frontend:
    image: vinodreddy1999/metam-services-v2-frontend:${METAM_V2_IMAGE_TAG:-2.0.0-beta.4}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:${V2_API_PORT:-18000}
    restart: unless-stopped
    ports:
      - "${V2_FRONTEND_PORT:-18081}:8080"
    depends_on:
      platform-api:
        condition: service_healthy
    networks:
      - metam-v2-network

  worker:
    image: vinodreddy1999/metam-services-v2-fullstack:${METAM_V2_IMAGE_TAG:-2.0.0-beta.5}
    build: .
    command: celery -A app.jobs.celery_app worker --loglevel=info
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-metam}:${POSTGRES_PASSWORD:-metam}@postgres:5432/${POSTGRES_DB:-metam_v2}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - metam-v2-network

  seed-enterprise-data:
    image: vinodreddy1999/metam-services-v2-fullstack:${METAM_V2_IMAGE_TAG:-2.0.0-beta.5}
    build: .
    command: python scripts/seed_enterprise_data.py
    restart: "no"
    environment:
      BASE_URL: http://fullstack-app:8080
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-metam}:${POSTGRES_PASSWORD:-metam}@postgres:5432/${POSTGRES_DB:-metam_v2}
    depends_on:
      fullstack-app:
        condition: service_healthy
    networks:
      - metam-v2-network

  vinod-live-data-stream:
    image: vinodreddy1999/metam-services-v2-fullstack:${METAM_V2_IMAGE_TAG:-2.0.0-beta.4}
    build: .
    command: python scripts/run_vinod_live_stream.py
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-metam}:${POSTGRES_PASSWORD:-metam}@postgres:5432/${POSTGRES_DB:-metam_v2}
      VINOD_LIVE_DURATION_HOURS: ${VINOD_LIVE_DURATION_HOURS:-48}
      VINOD_LIVE_INTERVAL_SECONDS: ${VINOD_LIVE_INTERVAL_SECONDS:-10}
      VINOD_LIVE_BATCH_SIZE: ${VINOD_LIVE_BATCH_SIZE:-50}
      VINOD_LIVE_AUDIT_EVERY_BATCHES: ${VINOD_LIVE_AUDIT_EVERY_BATCHES:-12}
      VINOD_LIVE_HOLD_AFTER_COMPLETE: ${VINOD_LIVE_HOLD_AFTER_COMPLETE:-true}
    depends_on:
      platform-api:
        condition: service_healthy
    networks:
      - metam-v2-network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${V2_PROXY_PORT:-180}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      fullstack-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - metam-v2-network

volumes:
  metam_v2_postgres_data:
  metam_v2_pgadmin_data:

networks:
  metam-v2-network:
    driver: bridge
